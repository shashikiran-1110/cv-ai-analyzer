name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      llm_model:
        description: "Run real-model LLM evals with this model (needs the OPENAI_API_KEY secret); empty = skip"
        required: false
        default: ""

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit, regression and API tests
        run: python -m pytest -q
      - name: Eval gate (deterministic suites + LLM suites against the adversarial mock; defenses must stay at 0)
        run: python -m eval.run --check --mode mock --no-persist --out eval/reports/ci.md
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: eval-report, path: eval/reports/ci.md }

  llm-eval-live:
    if: github.event_name == 'workflow_dispatch' && inputs.llm_model != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Real-model LLM evals (records cassettes; compare per model against eval/baseline.real.json)
        run: python -m eval.run --suite llm --mode record --model "${{ inputs.llm_model }}" --check --no-persist --out eval/reports/llm-live.md
        env: { OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}", AI_PROVIDER: openai }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: llm-eval-report, path: "eval/reports/llm-live.md\neval/cassettes/" }

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cv, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: cvtest }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cv" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt "psycopg[binary]>=3.1"
      - name: Tests on Postgres
        run: python -m pytest -q --ignore=tests/e2e
        env: { TEST_DATABASE_URL: "postgresql+psycopg://cv@127.0.0.1:5432/cvtest" }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: cd frontend && npm ci && npm run build
      - name: Browser end-to-end (demo server, all external services faked)
        run: python -m pytest -q tests/e2e
        env: { E2E_CHROMIUM: "" }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cv-match .

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Typecheck + production build
        run: npm run build
