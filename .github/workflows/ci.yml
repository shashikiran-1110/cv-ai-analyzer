name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit, regression and API tests
        run: python -m pytest -q
      - name: Eval gate (deterministic suites, ROADMAP §7.4)
        run: python -m eval.run --check --out eval/reports/ci.md
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: eval-report, path: eval/reports/ci.md }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Typecheck + production build
        run: npm run build
